<style data-k>
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#263028; --muted:#6b756c; --line:#e2e8e1;
  --accent:#8fa290; --accent-deep:#5d715f; --accent-ink:#475b4a; --accent-soft:#e6ede6;
  --comp:#937a8d; --comp-soft:#f1e8ee; --comp-light:#d3c1ce;
  --grey-soft:#edf0ec;
  --radius:16px; --shadow:0 1px 2px rgba(30,45,32,.05),0 4px 14px rgba(30,45,32,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 110px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:27px;letter-spacing:-.01em;line-height:1.1}
h1 small{display:block;font-family:'DM Sans';font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:6px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.today-chip{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs a{flex:1;text-align:center;padding:10px 4px 11px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent-deep)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.hero{background:linear-gradient(135deg,#7f937f,#55695a);color:#fff;border-radius:20px;padding:20px 20px 18px;box-shadow:var(--shadow)}
.hero .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.hero .when{font-family:'Fraunces',serif;font-size:24px;margin:6px 0 2px}
.hero .what{font-size:15px;opacity:.95}
.hero .pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.hero .edit-btn{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1;color:var(--accent-ink)}
.stat .t{font-size:12px;color:var(--muted);margin-top:5px}
.lesson{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.lesson:first-child,.lesson.first{border-top:0}
.lesson .time{font-weight:700;font-size:14.5px}
.lesson .time span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lesson .cls{font-weight:700;font-size:16px}
.lesson .room,.room{font-size:13px;color:var(--muted);margin-top:2px}
.room b{color:var(--ink);font-weight:600}
.room .na{color:var(--comp);font-weight:600}
.lnote{font-size:12.5px;color:var(--accent-ink);margin-top:3px;font-style:italic}
.tag-mod{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--comp);background:var(--comp-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge{display:inline-block;border-radius:999px;font-size:11.5px;font-weight:700;padding:3px 9px;white-space:nowrap}
.b-done{background:var(--accent-soft);color:var(--accent-ink)}
.b-plan{background:var(--comp-soft);color:var(--comp)}
.b-off{background:var(--grey-soft);color:var(--muted);text-decoration:line-through}
.b-today{background:var(--accent-deep);color:#fff}
.lesson.off .cls,.lesson.off .time,.row-l.off .dt,.row-l.off b{color:var(--muted);text-decoration:line-through}
.st-btn{border:0;background:none;cursor:pointer;padding:0;font:inherit}
.edit-btn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.add-btn{white-space:nowrap;border:0;background:var(--accent-deep);color:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans'}
.editor{background:var(--accent-soft);border-radius:14px;padding:14px;margin:10px 0;color:var(--ink)}
.editor .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.editor label{display:flex;flex-direction:column;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);gap:4px}
.editor label.full{grid-column:1/-1}
.editor input,.editor select{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);border:1px solid #cfd9ce;background:#fff;border-radius:10px;padding:9px 10px;width:100%}
.editor .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.editor .acts button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid transparent}
.btn-save{background:var(--accent-deep);color:#fff}
.btn-cancel{background:#fff;color:var(--ink);border-color:var(--line)!important}
.btn-reset{background:#fff;color:var(--comp);border-color:var(--comp-light)!important}
.btn-del{background:var(--comp);color:#fff}
.err{color:var(--comp);font-size:12.5px;font-weight:600;margin-top:8px}
.day{margin-bottom:12px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.day-h .d{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-deep)}
.day-h .h{font-size:12.5px;color:var(--muted)}
.day.empty .card{color:var(--muted);font-size:13.5px;padding:12px 18px}
.day.istoday .card{outline:2px solid var(--accent)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.weeknav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;color:var(--ink)}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav .mid{text-align:center}
.weeknav .mid .r{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.weeknav .mid .s{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--ink);background:var(--comp-soft);border-radius:12px;padding:10px 13px;margin-bottom:12px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
.month-h{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.month-h span{font-family:'DM Sans';font-size:13px;color:var(--muted);font-weight:600}
.row-l{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row-l:first-child,.row-l.first{border-top:0}
.row-l .dt{font-weight:700}
.row-l .dt span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px}
.total .big{font-family:'Fraunces',serif;font-size:44px;font-weight:600;line-height:1;color:var(--accent-ink)}
.total .sub{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--grey-soft);border-radius:99px;overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:0}
.mcard{margin-bottom:12px}
.mcard .mh{display:flex;justify-content:space-between;align-items:baseline}
.mcard .mh .m{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.mcard .mh .v{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--accent-ink)}
.mcard .split{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mcard .split span{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}
.extra{border-left:4px solid var(--comp);}
.foot{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.55}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px}
.mc-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.add-btn:disabled{opacity:.6;cursor:default}
.report{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.rw{padding:8px 0;border-bottom:1px solid var(--line)}
.rw-h{font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.rw-h span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--comp)}
.chg{font-size:13px;margin-top:5px;padding:6px 9px;border-radius:9px;line-height:1.4}
.ch-a{background:var(--accent-soft);color:var(--accent-ink)}
.ch-r{background:var(--comp-soft);color:var(--comp);text-decoration:line-through}
.ch-m{background:var(--grey-soft);color:var(--ink)}
.report .acts button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid transparent}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1 small{white-space:nowrap;letter-spacing:.08em}
.today-chip{white-space:normal!important;max-width:90px}
.brand .logo{width:46px;height:46px;flex:none}
body.locked .wrap,body.locked nav.tabs{display:none}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
body.locked #login{display:flex}
#login .box{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;width:100%;max-width:360px}
#login h2{margin:12px 0 4px}
#login label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-top:14px}
#login input[type=email],#login input[type=password]{font:inherit;font-size:16px;width:100%;border:1px solid #cfd9ce;border-radius:10px;padding:11px 12px;margin-top:5px}
#login .rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px;text-transform:none;letter-spacing:0;font-weight:500}
#login button{margin-top:18px;width:100%;border:0;background:var(--accent-deep);color:#fff;border-radius:999px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
#login .err{min-height:18px}
@media (min-width:700px){ .wrap{padding-top:34px} h1{font-size:32px} }
</style>
</head>

  const vp=page.getViewport({scale:1});
  const H=vp.height;

  const chars=[];

  for(const w of ws){
    if(w.top<Y+22||w.x0<X0) continue;

/* Estrae gli allegati da un messaggio Gmail in formato RAW (base64url di un RFC822) */
function b64ToBytes(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/=]/g,'');
  while(s.length%4) s+='=';
  const bin=atob(s); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function bytesToLatin1(u){let s='';const C=0x8000;for(let i=0;i<u.length;i+=C)s+=String.fromCharCode.apply(null,u.subarray(i,i+C));return s}
function decodeWords(s){
  return s.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,(m,cs,enc,txt)=>{
    try{
      let bytes;
      if(enc.toUpperCase()==='B') bytes=b64ToBytes(txt);
      else{const t=txt.replace(/_/g,' ').replace(/=([0-9A-Fa-f]{2})/g,(x,h)=>String.fromCharCode(parseInt(h,16)));bytes=Uint8Array.from(t,c=>c.charCodeAt(0))}
      return new TextDecoder(cs.toLowerCase()).decode(bytes);
    }catch(e){return txt}
  }).replace(/\?=\s+=\?/g,'?==?');
}
function parseHeaders(block){
  const h={};
  block.replace(/\r\n[ \t]+/g,' ').replace(/\n[ \t]+/g,' ').split(/\r?\n/).forEach(line=>{
    const i=line.indexOf(':'); if(i>0){const k=line.slice(0,i).trim().toLowerCase(); h[k]=(h[k]?h[k]+'; ':'')+line.slice(i+1).trim()}
  });
  return h;
}
function param(hv,name){
  if(!hv) return null;
  // RFC2231 filename*=UTF-8''... (anche spezzato in filename*0*=)
  const parts=[];const re=new RegExp(name+'\\*(\\d+)?\\*?=("?)([^";]*)\\2','gi');let m;
  while((m=re.exec(hv))){parts.push({i:+(m[1]||0),v:m[3]})}
  if(parts.length){
    parts.sort((a,b)=>a.i-b.i);let v=parts.map(p=>p.v).join('');
    const mm=/^([^']*)'[^']*'(.*)$/.exec(v); if(mm) v=mm[2];
    try{return decodeURIComponent(v)}catch(e){return v}
  }
  const m2=new RegExp('(?:^|;)\\s*'+name+'=("([^"]*)"|[^;]*)','i').exec(hv);
  if(!m2) return null;
  return decodeWords((m2[2]!=null?m2[2]:m2[1]).trim());
}
function walkMime(latin, out){
  const sep=latin.search(/\r?\n\r?\n/);
  const head=sep<0?latin:latin.slice(0,sep);
  const body=sep<0?'':latin.slice(sep).replace(/^\r?\n\r?\n/,'');
  const h=parseHeaders(head);
  const ct=h['content-type']||'text/plain';
  if(/^multipart\//i.test(ct)){
    const b=param(ct,'boundary'); if(!b) return;
    const pieces=body.split('--'+b);
    for(let i=1;i<pieces.length;i++){
      let p=pieces[i]; if(p.startsWith('--')) break;
      p=p.replace(/^\r?\n/,'');
      walkMime(p,out);
    }
    return;
  }
  if(/^message\/rfc822/i.test(ct)){walkMime(body,out);return}
  const name=param(h['content-disposition'],'filename')||param(ct,'name');
  if(name){
    const enc=(h['content-transfer-encoding']||'').toLowerCase();
    let bytes;
    if(enc==='base64') bytes=b64ToBytes(body);
    else bytes=Uint8Array.from(body,c=>c.charCodeAt(0)&255);
    out.push({filename:name,mime:ct.split(';')[0].trim().toLowerCase(),bytes});
  }
}
function rawToAttachments(raw){
  const latin=bytesToLatin1(b64ToBytes(raw));
  const out=[];walkMime(latin,out);return out;
}

async function checkMail(){
  if(MAIL.busy) return;
  MAIL={busy:true,msg:'',err:false,report:null,step:'Cerco le mail…'};render();
  try{
    const c=window.claude; const MCP=c&&c.use?await c.use('mcp'):null;
    if(!MCP) throw {message:'Gmail non è disponibile in questa vista: apri l\'app da claude.ai con il tuo account.',plain:true};
    const sr=await gmail(MCP,'search_threads',{query:`from:${MAIL_FROM} has:attachment newer_than:120d`,pageSize:25});
    let msgs=[];
    for(const th of (sr&&sr.threads)||[]){
      let list=th.messages||[];
      if((th.messageCount||0)>list.length){try{const full=await gmail(MCP,'get_thread',{threadId:th.id,messageFormat:'METADATA_ONLY'});list=(full&&full.messages)||list}catch(e){}}
      list.filter(m=>String(m.sender||'').toLowerCase().includes(MAIL_FROM)).forEach(m=>msgs.push({id:m.id,date:m.date||'',ms:+m.internalDate||Date.parse(m.date)||0}));
    }
    const seen=new Set();msgs=msgs.filter(m=>!seen.has(m.id)&&seen.add(m.id)).sort((a,b)=>a.ms-b.ms);
    if(!msgs.length){MAIL={busy:false,msg:'Nessuna mail con orari trovata negli ultimi 4 mesi.',report:null};render();return}
    const lib=await pdfLib();
    const found={};let nPdf=0;
    for(let i=0;i<msgs.length;i++){
      const m=msgs[i];
      MAIL.step=`Leggo la mail ${i+1} di ${msgs.length}…`;render();
      const full=await gmail(MCP,'get_message',{messageId:m.id,messageFormat:'RAW'});
      const raw=findRaw(full); if(!raw) continue;
      const atts=rawToAttachments(raw).filter(a=>/prima/i.test(a.filename)&&(/\.pdf$/i.test(a.filename)||a.mime==='application/pdf'));
      for(const a of atts){
        const doc=await lib.getDocument({data:a.bytes,disableFontFace:true,isEvalSupported:false}).promise;
        const r=await ciofsExtract(await doc.getPage(1),'SANNA');
        if(!r.range) continue;
        const yy=r.af?(r.range.m1>=8?r.af[0]:r.af[1]):parseD(iso(now())).getFullYear();
        const mon=mondayOf(iso(new Date(yy,r.range.m1-1,r.range.d1)));
        const nm=/^\s*(\d+)/.exec(a.filename);
        found[mon]={n:nm?nm[1].padStart(2,'0'):'',mon,file:a.filename,mailDate:iso(new Date(m.ms||Date.now())),
          lessons:r.lessons.map(l=>({date:addDays(mon,l.day),start:l.start,end:l.end,cls:l.cls,room:l.room}))};
        nPdf++;
      }
    }
    if(!nPdf){MAIL={busy:false,msg:`Ho letto ${msgs.length} mail ma non ho trovato PDF con “PRIMA” nel nome.`,report:null};render();return}
    // confronto
    const pw=STATE.pdfWeeks||{};
    const rep={weeks:[],same:0,orphan:0,found};
    Object.values(found).sort((a,b)=>a.mon<b.mon?-1:1).forEach(nw=>{
      const cur=pw[nw.mon]?pw[nw.mon].lessons:LESSONS.filter(l=>mondayOf(l.date)===nw.mon);
      const isNew=!pw[nw.mon]&&!BASE_WEEKS.some(w=>w.mon===nw.mon);
      const A=new Map(cur.map(l=>[sig(l),l])),B=new Map(nw.lessons.map(l=>[sig(l),l]));
      let removed=cur.filter(l=>!B.has(sig(l))),added=nw.lessons.filter(l=>!A.has(sig(l)));
      const changed=[];
      removed=removed.filter(o=>{const j=added.findIndex(n=>n.date===o.date&&(n.cls===o.cls||(n.start===o.start&&n.end===o.end)));if(j>=0){changed.push({from:o,to:added[j]});added.splice(j,1);return false}return true});
      if(!removed.length&&!added.length&&!changed.length&&!isNew){rep.same++;return}
      const newIds=new Set(nw.lessons.map(l=>l.date+'_'+l.start+'_'+l.cls));
      Object.keys(STATE.overrides).forEach(id=>{if(mondayOf(id.slice(0,10))===nw.mon&&!newIds.has(id))rep.orphan++});
      rep.weeks.push(Object.assign({},nw,{isNew,removed,added,changed,oldH:cur.reduce((s,l)=>s+l.end-l.start,0),newH:nw.lessons.reduce((s,l)=>s+l.end-l.start,0)}));
    });
    STATE.lastCheck=Date.now();
    if(!rep.weeks.length){MAIL={busy:false,msg:`Tutto già aggiornato: ${nPdf} PDF “PRIMA” letti da ${msgs.length} mail, nessuna differenza con i dati dell'app.`,report:null};render();return}
    MAIL={busy:false,msg:`Ho letto ${nPdf} PDF “PRIMA” da ${msgs.length} mail. Ecco cosa cambia:`,report:rep};render();
  }catch(e){
    MAIL={busy:false,err:true,msg:e&&e.plain?esc(e.message):errText(e),report:null};render();
  }
}

/* ===== GOOGLE CALENDAR ===== */
const CAL_ID=window.__DATA.calId;
const CAL_FROM='2027-01-01';   // sincronizza solo da gennaio 2027
const CAL_TITLE='SCUOLA';
async function cal(MCP,tool,input){return norm(await MCP.callTool('Google Calendar',tool,input))}
function calBlocks(){
  // un evento per giorno: dalla prima ora di inizio all'ultima ora di fine
  const b={};
  ALL.filter(l=>l.date>=CAL_FROM&&counted(l)).forEach(l=>{
    const x=b[l.date]; if(!x) b[l.date]={start:l.start,end:l.end}; else{x.start=Math.min(x.start,l.start);x.end=Math.max(x.end,l.end)}
  });
  return b;
}
function calPlan(){
  const want=calBlocks(), have=STATE.calEvents||{};
  const ops=[];
  Object.keys(want).sort().forEach(d=>{
    const w=want[d],h=have[d];
    if(!h) ops.push({op:'create',date:d,start:w.start,end:w.end});
    else if(h.start!==w.start||h.end!==w.end) ops.push({op:'update',date:d,start:w.start,end:w.end,id:h.id});
  });
  Object.keys(have).forEach(d=>{if(!want[d]) ops.push({op:'delete',date:d,id:have[d].id})});
  return ops;
}
const tISO=(d,h)=>d+'T'+pad(Math.floor(h))+':'+pad(Math.round((h%1)*60))+':00';
function calPlanText(ops){
  const n=k=>ops.filter(o=>o.op===k).length;
  const p=[];if(n('create'))p.push(n('create')+' da creare');if(n('update'))p.push(n('update')+' da spostare');if(n('delete'))p.push(n('delete')+' da cancellare');
  return p.join(', ');
}
async function syncCalendar(onStep){
  const ops=calPlan(); if(!ops.length) return {done:0,errors:0};
  const c=window.claude; const MCP=c&&c.use?await c.use('mcp'):null;
  if(!MCP) throw {message:'Google Calendar non è disponibile in questa vista.',plain:true};
  STATE.calEvents=STATE.calEvents||{};
  let done=0,errors=0;
  for(let i=0;i<ops.length;i++){
    const o=ops[i]; onStep&&onStep(`Calendario: ${i+1} di ${ops.length}…`);
    try{
      if(o.op==='delete'){
        try{await cal(MCP,'delete_event',{calendarId:CAL_ID,eventId:o.id,notificationLevel:'NONE'})}catch(e){}
        delete STATE.calEvents[o.date];
      }else{
        let id=o.id;
        if(o.op==='update'){
          try{await cal(MCP,'update_event',{calendarId:CAL_ID,eventId:id,startTime:tISO(o.date,o.start),endTime:tISO(o.date,o.end),timeZone:'Europe/Rome',notificationLevel:'NONE'})}
          catch(e){id=null}
        }
        if(!id){
          // evita doppioni: se quel giorno c'è già un evento SCUOLA, lo riusa
          let ex=null;
          try{const r=await cal(MCP,'list_events',{calendarId:CAL_ID,startTime:o.date+'T00:00:00',endTime:addDays(o.date,1)+'T00:00:00',fullText:CAL_TITLE,timeZone:'Europe/Rome'});
            ex=((r&&r.events)||[]).find(e=>String(e.summary||'').trim().toUpperCase()===CAL_TITLE)}catch(e){}
          if(ex){id=ex.id;await cal(MCP,'update_event',{calendarId:CAL_ID,eventId:id,startTime:tISO(o.date,o.start),endTime:tISO(o.date,o.end),timeZone:'Europe/Rome',notificationLevel:'NONE'})}
          else{const r=await cal(MCP,'create_event',{calendarId:CAL_ID,summary:CAL_TITLE,startTime:tISO(o.date,o.start),endTime:tISO(o.date,o.end),timeZone:'Europe/Rome',notificationLevel:'NONE'});id=r&&(r.id||(r.event&&r.event.id))}
        }
        if(id) STATE.calEvents[o.date]={id,start:o.start,end:o.end}; else errors++;
      }
      done++;
    }catch(e){errors++}
  }
  return {done,errors};
}

/* ===== VERSIONE AUTONOMA: collegamento diretto a Google (Gmail + Calendar) ===== */
const G_SCOPES='https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/calendar.events';
let G_TOKEN=null,G_EXP=0,G_CLIENT=null,G_PENDING=null;
function gReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2)}
function gClient(){
  if(G_CLIENT||!STATE.googleClientId||!gReady()) return G_CLIENT;
  G_CLIENT=google.accounts.oauth2.initTokenClient({client_id:STATE.googleClientId,scope:G_SCOPES,
    callback:(r)=>{ if(r&&r.access_token){G_TOKEN=r.access_token;G_EXP=Date.now()+((+r.expires_in||3500)-60)*1000;const f=G_PENDING;G_PENDING=null;f&&f()}
      else{MAIL={busy:false,err:true,msg:'Accesso a Google non riuscito.',report:null};render()} },
    error_callback:(e)=>{G_PENDING=null;MAIL={busy:false,err:true,msg:'Accesso a Google annullato o bloccato'+(e&&e.type?' ('+esc(e.type)+')':'')+'.',report:null};render()}});
  return G_CLIENT;
}
/* esegue fn con un token valido; se serve, chiede l'accesso (va chiamata da un tocco) */
function withGoogle(fn){
  if(!STATE.googleClientId){MAIL={busy:false,err:true,msg:'Inserisci prima il Client ID di Google qui sotto.',report:null};render();return}
  if(G_TOKEN&&Date.now()<G_EXP){fn();return}
  const c=gClient(); if(!c){MAIL={busy:false,err:true,msg:'Il servizio di accesso Google non si è caricato: controlla la connessione e riprova.',report:null};render();return}
  G_PENDING=fn; c.requestAccessToken({prompt:G_TOKEN?'':'consent'});
}
async function gFetch(url,opt={}){
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({'Authorization':'Bearer '+G_TOKEN,'Content-Type':'application/json'},opt.headers||{})}));
  if(r.status===204) return {};
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.code=r.status===401?'authz':r.status===403?'permission':r.status===429?'rate':'http';e.status=r.status;throw e}
  return j;
}
const GM='https://gmail.googleapis.com/gmail/v1/users/me/', GC='https://www.googleapis.com/calendar/v3/calendars/';

const GAPI={callTool:async(server,tool,input)=>{
  if(server==='Gmail'){
    if(tool==='search_threads'){
      const j=await gFetch(GM+'messages?maxResults='+(input.pageSize||25)+'&q='+encodeURIComponent(input.query));

  }
  if(server==='Google Calendar'){
    const base=GC+encodeURIComponent(input.calendarId)+'/events';
    const dt=s=>({dateTime:s,timeZone:input.timeZone||'Europe/Rome'});
    if(tool==='list_events'){const j=await gFetch(base+'?singleEvents=true&timeMin='+encodeURIComponent(dayISO(input.startTime.slice(0,10)))+'&timeMax='+encodeURIComponent(dayISO(input.endTime.slice(0,10)))+(input.fullText?'&q='+encodeURIComponent(input.fullText):''));return {payload:{events:j.items||[]}}}

    if(tool==='update_event') return {payload:await gFetch(base+'/'+encodeURIComponent(input.eventId)+'?sendUpdates=none',{method:'PATCH',body:JSON.stringify({start:dt(input.startTime),end:dt(input.endTime)})})};

  if(q('[data-gcancel]')){G_SHOWCFG=false;render();e.stopImmediatePropagation();return}
  if(q('[data-gcfg]')){G_SHOWCFG=true;render();e.stopImmediatePropagation();return}
  if(q('[data-mail]')){e.stopImmediatePropagation();if(MAIL.busy)return;withGoogle(()=>checkMail());return}
  if(q('[data-apply]')){e.stopImmediatePropagation();if(calPlan().length||MAIL.report&&MAIL.report.weeks.some(w=>addDays(w.mon,4)>=CAL_FROM))withGoogle(()=>applyUpdate());else applyUpdate();return}
  if(q('[data-calsync]')){e.stopImmediatePropagation();withGoogle(()=>{MAIL={busy:true,msg:'',report:null,step:'Aggiorno il calendario…'};render();
    syncCalendar(s=>{MAIL.step=s;render()}).then(r=>{MAIL={busy:false,msg:r.errors?`${r.errors} eventi non aggiornati: riprova.`:'Calendario aggiornato.',err:!!r.errors,report:null}})
    .catch(err=>{MAIL={busy:false,err:true,msg:errText(err),report:null}}).finally(()=>{persist();render()})});return}
},true);

/* ===== SALVATAGGIO ===== */
let artifactApi=null, saveTimer=null;
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t}
function buildDoc(){
  const d=SRC_DOC.cloneNode(true);
  // tieni solo gli elementi propri della pagina
  ['head','body'].forEach(tag=>{const p=d.querySelector(tag);if(!p)return;[...p.children].forEach(ch=>{if(!ch.hasAttribute('data-k'))ch.remove()})});
  d.querySelector('#state').textContent=JSON.stringify(STATE).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+d.outerHTML;
}
function persist(){
  STATE.savedAt=Date.now();
  try{localStorage.setItem('ciofs_state_v2',JSON.stringify(STATE))}catch(e){}
  if(!artifactApi){setSync(LOCAL_ONLY?'Modifiche salvate solo su questo dispositivo':'Salvato');return}
  setSync('Salvataggio…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await artifactApi.publish(buildDoc());setSync('Salvato')}
    catch(e){const m=String(e&&e.message||e);setSync(/conflict/i.test(m)?'Aggiornato da un altro dispositivo':'Salvato solo su questo dispositivo');}
  },1200);
}
(async()=>{
  try{
    const c=window.claude; if(!c||!c.use){LOCAL_ONLY=true;return}
    artifactApi=await c.use('artifact');
    if(!artifactApi) LOCAL_ONLY=true;
  }catch(e){LOCAL_ONLY=true}
})();

/* ===== RENDER & EVENTI ===== */
const VIEWS={oggi:vOggi,settimana:vSettimana,calendario:vCalendario,riepilogo:vRiepilogo};
function current(){const v=(location.hash||'').slice(1);return VIEWS[v]?v:'oggi'}
function render(){
  const v=current();
  document.getElementById('view').innerHTML=VIEWS[v]();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const n=now();document.getElementById('todayChip').textContent=DAYN[n.getDay()]+' '+n.getDate()+' '+MONN[n.getMonth()];
}
function readEditor(box){
  const g=c=>box.querySelector('.'+c);
  const v={date:g('e_date').value,start:+g('e_start').value,end:+g('e_end').value,cls:g('e_cls').value.trim().toUpperCase(),room:g('e_room').value.trim().toUpperCase()||null,note:g('e_note').value.trim()};
  if(!v.date) return [null,'Inserisci la data.'];
  if(!v.cls) return [null,'Inserisci la classe.'];
  if(v.end<=v.start) return [null,"L'ora di fine deve essere dopo l'inizio."];
  return [v,''];
}
document.addEventListener('click',e=>{
  const q=s=>e.target.closest(s);
  let t;
  if(t=q('[data-toggle]')){const id=t.dataset.toggle;if(STATE.off[id])delete STATE.off[id];else STATE.off[id]=1;persist();render();return}
  if(t=q('[data-edit]')){editing=t.dataset.edit;editErr='';render();const ed=document.querySelector('.editor');if(ed)ed.scrollIntoView({behavior:'smooth',block:'center'});return}
  if(q('[data-add]')){editing='new';editErr='';render();return}
  if(q('[data-cancel]')){editing=null;editErr='';render();return}
  if(t=q('[data-save]')){
    const id=t.dataset.save;const [v,err]=readEditor(t.closest('.editor'));
    if(err){editErr=err;render();return}
    if(id==='new'){STATE.added.push(Object.assign({id:'add_'+Date.now()},v))}
    else{
      const a=STATE.added.find(x=>x.id===id);
      if(a) Object.assign(a,v);
      else{
        const o=LESSONS.find(l=>l.date+'_'+l.start+'_'+l.cls===id);
        const same=o&&o.date===v.date&&o.start===v.start&&o.end===v.end&&o.cls===v.cls&&(o.room||null)===v.room&&!v.note;
        if(same) delete STATE.overrides[id]; else STATE.overrides[id]=v;
      }
    }
    editing=null;editErr='';rebuild();persist();render();return}
  if(t=q('[data-reset]')){delete STATE.overrides[t.dataset.reset];editing=null;rebuild();persist();render();return}
  if(t=q('[data-del]')){STATE.added=STATE.added.filter(x=>x.id!==t.dataset.del);delete STATE.off[t.dataset.del];editing=null;rebuild();persist();render();return}
  if(q('[data-mail]')){checkMail();return}
  if(q('[data-apply]')){applyUpdate();return}
  if(q('[data-calsync]')){(async()=>{MAIL={busy:true,msg:'',report:null,step:'Aggiorno il calendario…'};render();
    try{const r=await syncCalendar(s=>{MAIL.step=s;render()});MAIL={busy:false,msg:r.errors?`${r.errors} eventi non aggiornati: riprova.`:'Calendario aggiornato.',err:!!r.errors,report:null}}
    catch(e){MAIL={busy:false,err:true,msg:e&&e.plain?esc(e.message):errText(e),report:null}}
    persist();render()})();return}
  if(q('[data-dismiss]')){MAIL={busy:false,msg:'',report:null};render();return}
  if(t=q('[data-cf]')){calFilter=t.dataset.cf;render();return}
  if(q('#wPrev')){weekIdx--;render();return}
  if(q('#wNext')){weekIdx++;render();return}
});
window.addEventListener('hashchange',()=>{editing=null;render();window.scrollTo(0,0)});
render();
setInterval(()=>{if(!editing&&!MAIL.busy&&!MAIL.report)render()},60000);
</script>
</body>
